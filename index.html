
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>桶屋ストーリーAI - 低位株アナリスト</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
</style>
</head>

<body>
<div class="container">
</div>

<script>

// =============================
// ✅ 状態管理
// =============================
let predictions = [];
let currentArticleData = null;
let multipleScenarios = [];
let usedScenarios = [];

// =============================
// ✅ JSON補正（統一版）
// =============================
function normalizeJSON(text) {
  return text
    .replace(/[""]/g, '"')
    .replace(/['']/g, "'")
    .replace(/\u00A0/g, ' ')
    .trim();
}

// =============================
// ✅ JSON読み込み（完全修正版）
// =============================
function loadArticleFromJson(jsonText) {
  let data;
  try {
    const clean = normalizeJSON(jsonText);
    data = JSON.parse(clean);
  } catch(e) {
    alert('JSON解析エラー:\n' + e.message);
    return;
  }

  if (!data.scenarios || data.scenarios.length < 2) {
    alert('scenariosが2件以上必要です');
    return;
  }

  displayScenarios(data);
  document.getElementById('jsonCard').style.display = 'none';
  document.getElementById('step1Card').style.display = 'none';
}

// =============================
// ✅ シナリオ表示（安全化）
// =============================
function displayScenarios(data) {
  multipleScenarios = data.scenarios || [];

  const container = document.getElementById('scenarioList');
  container.innerHTML = '';

  multipleScenarios.forEach((s, idx) => {
    const div = document.createElement('div');
    div.className = 'scenario-card';
    div.innerHTML = `
      <strong>${s.title}</strong><br>
      確率: ${s.probability}%<br>
      ${s.newsChain.map(n=>n.headline).join(' → ')}
    `;
    div.onclick = () => selectScenario(idx);
    container.appendChild(div);
  });

  document.getElementById('scenarioCard').style.display = 'block';
}

// =============================
// ✅ シナリオ選択
// =============================
function selectScenario(idx) {
  const s = multipleScenarios[idx];
  currentArticleData = s;
  displayPreview(s);
  document.getElementById('previewCard').style.display = 'block';
}

// =============================
// ✅ プレビュー表示
// =============================
function displayPreview(data) {
  const el = document.getElementById('articlePreview');

  el.innerHTML = `
    <h3>${data.title}</h3>
    <p>${data.causalStory || ''}</p>
  `;
}

// =============================
// ✅ 校正反映（安全版）
// =============================
function applyRevised() {
  const txt = document.getElementById('revisedJsonInput').value.trim();
  if (!txt) return alert('貼り付けてください');

  try {
    const obj = JSON.parse(txt);
    currentArticleData = obj.revisedArticle || obj;
    displayPreview(currentArticleData);
  } catch(e) {
    alert('JSONエラー');
  }
}

// =============================
// ✅ コンプライアンス表示
// =============================
function applyCompliance() {
  const result = document.getElementById('complianceResultInput').value;
  const el = document.getElementById('complianceDisplay');

  el.style.display = 'block';
  el.innerHTML = result.includes('OK')
    ? '<div class="compliance-ok">OK</div>'
    : '<div class="compliance-ng">NG</div>';
}

// =============================
// ✅ イベント登録（崩壊防止）
// =============================
window.onload = () => {
  document.getElementById('applyArticleBtn').onclick =
    () => loadArticleFromJson(document.getElementById('jsonInput').value);

  document.getElementById('applyRevisedBtn').onclick = applyRevised;
  document.getElementById('applyComplianceBtn').onclick = applyCompliance;
};

</script>
</body>
</html>
